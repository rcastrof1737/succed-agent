[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "succed"
version = "0.1.0"
description = "AI deal-matching platform for search funds: searcher scoring, company screening, Fit Index, deal execution and learning loop — built for Claude Code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6",
  "numpy>=1.26",
  "mcp>=1.2",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.1"]
dev = ["pytest>=8"]

[project.scripts]
succed = "succed.cli:main"
succed-mcp = "succed.mcp_server:main"

[tool.setuptools.packages.find]
include = ["succed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
